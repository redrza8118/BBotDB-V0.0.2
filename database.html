<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BBotDB Card Database</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="database-page-header">

        <div class="database-header-content">

            <h1>
                BBotDB Card Database
            </h1>

            <p>
                Search, filter, sort, and explore BasketBot cards.
            </p>

        </div>

    </header>


    <!-- ================================
         DATABASE
    ================================= -->

    <main class="database-page">

        <!-- ================================
             SEARCH & FILTERS
        ================================= -->

        <section class="database-controls">

            <!-- Search -->

            <div class="database-search">

                <input
                    type="text"
                    id="card-search"
                    placeholder="Search cards..."
                    autocomplete="off"
                >

            </div>


            <!-- Basic Filters -->

            <div class="database-filter-section">

                <h2>
                    Filters
                </h2>

                <div class="filter-row">

                    <select id="rarity-filter">

                        <option value="all">
                            All Rarities
                        </option>

                    </select>


                    <select id="position-filter">

                        <option value="all">
                            All Positions
                        </option>

                    </select>


                    <select id="trait-filter">

                        <option value="all">
                            All Traits
                        </option>

                    </select>

                </div>

            </div>


            <!-- Stat Filters -->

            <div class="database-filter-section">

                <h2>
                    Stat Range
                </h2>

                <div class="filter-row">

                    <div class="stat-filter">

                        <label for="shooting-min">
                            Shooting
                        </label>

                        <input
                            type="number"
                            id="shooting-min"
                            min="0"
                            max="100"
                            placeholder="Min"
                        >

                        <span>
                            –
                        </span>

                        <input
                            type="number"
                            id="shooting-max"
                            min="0"
                            max="100"
                            placeholder="Max"
                        >

                    </div>


                    <div class="stat-filter">

                        <label for="finishing-min">
                            Finishing
                        </label>

                        <input
                            type="number"
                            id="finishing-min"
                            min="0"
                            max="100"
                            placeholder="Min"
                        >

                        <span>
                            –
                        </span>

                        <input
                            type="number"
                            id="finishing-max"
                            min="0"
                            max="100"
                            placeholder="Max"
                        >

                    </div>


                    <div class="stat-filter">

                        <label for="defending-min">
                            Defending
                        </label>

                        <input
                            type="number"
                            id="defending-min"
                            min="0"
                            max="100"
                            placeholder="Min"
                        >

                        <span>
                            –
                        </span>

                        <input
                            type="number"
                            id="defending-max"
                            min="0"
                            max="100"
                            placeholder="Max"
                        >

                    </div>


                    <div class="stat-filter">

                        <label for="playmaking-min">
                            Playmaking
                        </label>

                        <input
                            type="number"
                            id="playmaking-min"
                            min="0"
                            max="100"
                            placeholder="Min"
                        >

                        <span>
                            –
                        </span>

                        <input
                            type="number"
                            id="playmaking-max"
                            min="0"
                            max="100"
                            placeholder="Max"
                        >

                    </div>

                </div>

            </div>


            <!-- Sorting -->

            <div class="database-filter-section">

                <h2>
                    Sort
                </h2>

                <div class="sort-row">

                    <label for="sort-filter">
                        Sort By:
                    </label>

                    <select id="sort-filter">

                        <option value="rarity-desc">
                            Rarity: Highest
                        </option>

                        <option value="name-asc">
                            Name A → Z
                        </option>

                        <option value="name-desc">
                            Name Z → A
                        </option>

                        <option value="shooting-desc">
                            Shooting: Highest
                        </option>

                        <option value="finishing-desc">
                            Finishing: Highest
                        </option>

                        <option value="defending-desc">
                            Defending: Highest
                        </option>

                        <option value="playmaking-desc">
                            Playmaking: Highest
                        </option>

                        <option value="total-desc">
                            Total Stats: Highest
                        </option>

                    </select>


                    <button id="clear-filters">
                        Clear Filters
                    </button>

                </div>

            </div>

        </section>


        <!-- ================================
             RESULTS
        ================================= -->

        <section class="database-results">

            <div class="database-results-header">

                <div>

                    <h2>
                        Cards
                    </h2>

                    <p>
                        Browse the BasketBot card database.
                    </p>

                </div>


                <p id="card-count">
                    0 cards found
                </p>

            </div>


            <div id="card-list"></div>

        </section>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            BBotDB — Community BasketBot Database
        </p>

    </footer>


    <script src="./card-data.js"></script>
    <script src="./database.js"></script>

</body>

</html>
